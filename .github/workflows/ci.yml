name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Pre-deployment release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:gate

      - name: Add release gate summary
        if: always()
        run: |
          if [ -f artifacts/release-gate-summary.md ]; then
            cat artifacts/release-gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Release Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "Summary artifact was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.sha }}
          path: artifacts/release-gate-summary.*
          if-no-files-found: error
          retention-days: 14
